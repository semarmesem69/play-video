<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEWS VIDEOS XXX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f5f5;font-family:Arial,sans-serif}
header{background:#101318;border-bottom:1px solid #252a31;padding:16px}
.wrap{max-width:900px;margin:auto}.brand{font-size:25px;font-weight:800}
main{padding:22px 14px 40px}.post{background:#13171d;border:1px solid #252b34;border-radius:14px;overflow:hidden}
.posthead{padding:16px}.title{font-size:20px;font-weight:700;line-height:1.35}.date{font-size:12px;color:#8e96a1;margin-top:7px}
.video-wrap{background:#000}.video-wrap video{display:block;width:100%;max-height:80vh;background:#000}
.thumb{width:100%;display:block;max-height:70vh;object-fit:cover}
.desc{padding:15px;color:#b9bec7;line-height:1.5}
.empty{text-align:center;padding:55px 15px;color:#999}
footer{text-align:center;padding:22px;color:#666;font-size:12px}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">Vance Tweet</div></div></header>
<main class="wrap">
<div id="post" class="post"></div>
</main>
<footer>© 2026 NEWS VIDEOS</footer>

<!-- ADSTERRA SOCIAL BAR -->
<script src="https://pl31444781.profitableratecpmnetwork.com/32/5c/71/325c71578d64a681ba94335a7b1fb0cc.js"></script>
<!-- ADSTERRA POPUNDER -->
<script src="https://pl31444813.profitableratecpmnetwork.com/6d/e1/c0/6de1c0edc0109a7c4eca22160d10c319.js"></script>

<script>
const params=new URLSearchParams(location.search);
const video=params.get("video");
const title=params.get("title") || "Video Vance Tweet";
const thumb=params.get("thumb");
const desc=params.get("desc") || "";
const date=params.get("date") || new Date().toLocaleDateString("id-ID");

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

const post=document.getElementById("post");

if(!video){
 post.innerHTML='<div class="empty"><h2>Vance Tweet</h2><p>https://drive.google.com/file/d/10rTyBpVh6922u_PcaccbTrie4oD_Rb_H/view?usp=sharing</p></div>';
}else{
 post.innerHTML=`
 <div class="posthead">
   <div class="title">${esc(title)}</div>
   <div class="date">${esc(date)}</div>
 </div>
 ${thumb ? `<img class="thumb" src="${esc(thumb)}" alt="">` : ""}
 <div class="video-wrap"><video controls playsinline preload="metadata" src="${esc(video)}"></video></div>
 ${desc ? `<div class="desc">${esc(desc)}</div>` : ""}
 `;
}
</script>
</body>
</html>
